name: CLI Tests

on:
  push:

permissions:
  contents: read

jobs:
  full-test-gate:
    name: Full CLI test gate
    runs-on: archsv
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full CLI test gate
        env:
          CLI_HUB_EVENTS_LOG: ${{ runner.temp }}/cli-hub-events.log
        run: |
          env -u CLAUDE_CLI_PATH -u CLAUDE_CODE_EXECUTABLE -u CLAUDE_CODE_EXECPATH \
            npm run typecheck && \
            npm run lint && \
            npm test && \
            NODE_ENV=test npm run test:client
